# Publicerar rekryteringssidan (DEMO_LIVE från Hemmet - Levelingresa) på GitHub Pages vid varje push.
# Sidan är färdigbyggd och statisk; bara Discord-siffrorna hämtas live i webbläsaren.
name: Publicera

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf .git .github README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 3
      - id: deploy
        uses: actions/deploy-pages@v4
